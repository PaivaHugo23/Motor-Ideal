<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Simples</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <span>MOTOR IDEAL</span>
    </header>  
    <section class = "HERO">
        <div class="box-img"></div>
        <div class="box-txt"><form id="formulario">

            <!-- Tipo do motor -->
         <label for="tipo">Tipo do portão:</label>
         <select id="tipo" name="tipo" required>
            <option value="">Selecione</option>
            <option value="deslizante">Deslizante</option>
            <option value="basculante">Basculante</option>
            <option value="pivotante">Pivotante</option>
         </select>

        <!-- Largura do motor -->
         <label for="largura">Largura do portão (m):</label>
         <input type="number" id="largura" name="largura" step="any" min="0" required>

        <!-- Alto fluxo -->
         <label for="altofluxo">Alto-fluxo:</label>
         <select id="altofluxo" name="altofluxo" required>
            <option value="">Selecione</option>
            <option value="sim">SIM</option>
            <option value="nao">NÃO</option>
         </select>

         <!-- Chapa do Portão -->
        <label for="chapa">Chapa do portão:</label>
        <select id="chapa" name="chapa" required>
            <option value="">Selecione</option>
            <option value="24">Chapa 24</option>
            <option value="22">Chapa 22</option>
            <option value="20">Chapa 20</option>
            <option value="18">Chapa 18</option>
            <option value="16">Chapa 16</option>
            <option value="14">Chapa 14</option>
        </select>

         <!-- Campo adicional para basculante -->
    <div id="campo-giro" style="display: none;">
      <label for="pontoGiro">Ponto de giro (m):</label>
      <input type="number" id="pontoGiro" name="pontoGiro" step="0.1">
    </div>

        <!-- Campo adicional para Pivotante -->
    <label for="pontoPivotante" id="campo-pivotante" style="display: none;">Tipo de Portão Pivotante:</label>
    <select id="pontoPivotante" name="pontoPivotante" style="display: none;">
      <option value="">Selecione</option>
      <option value="Folha simples">Folha simples</option>
      <option value="Folha dupla">Folha dupla</option>
    </select>



    <!-- Botão -->
    <button type="submit">Ver motores compatíveis</button>
  </form>

  <!-- Resultado aparecerá aqui -->
  <div id="resultado"></div>

  <!-- Script para exibir o campo de ponto de giro -->
  <div id="campo-giro" style="display: none;">

    <label for="pontoGiro">
        Ponto de giro (m):
    </label>

    <input
        type="number"
        id="pontoGiro"
        name="pontoGiro"
        step="0.1"
    >

</div>


  <!-- Script para exibir o campo de ponto de pivotante -->
  <label
    for="pontoPivotante"
    id="campo-pivotante"
    style="display: none;"
>
    Tipo de Portão Pivotante:
</label>

<select
    id="pontoPivotante"
    name="pontoPivotante"
    style="display: none;"
>

    <option value="">Selecione</option>

    <option value="folha simples">
        Folha simples
    </option>

    <option value="folha dupla">
        Folha dupla
    </option>

</select>

    <script src="script.js"></script></div>
    </section>
</body>
</html>
